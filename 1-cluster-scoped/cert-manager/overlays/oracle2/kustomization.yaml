apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - cluster-issuer.yaml
  - secrets.yaml

commonLabels:
  app.kubernetes.io/name: cert-manager
  app.kubernetes.io/part-of: platform

patches:   
- target:
    kind: ClusterIssuer
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-wave: "50"
- target:
    kind: Namespace
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-wave: "50"
- target:
    kind: Secret
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-wave: "100"
