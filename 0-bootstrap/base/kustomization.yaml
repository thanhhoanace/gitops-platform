apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bootstrap-cluster.yaml
  - repositories/
  - app-projects/
  - applications/
  - app-generator/applicationset.yaml
  # - argocd/namespace.yaml

patches:   
- target:
    kind: AppProject
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-wave: "5"
- target:
    kind: Application
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-wave: "10"
