## Kubernetes Secret chứa credentials cho các git repositories
# Loại 1: SSH Private Key (khuyến nghị cho CI/CD)
# Loại 2: Personal Access Token / Password (nếu repo không hỗ trợ SSH)
#
# Cách tạo Secret từ SSH key hoặc PAT:
# - SSH: kubectl create secret generic git-ssh-key --from-file=ssh-privatekey=/path/to/id_rsa -n argocd
# - HTTPS PAT: kubectl create secret generic git-https-token --from-literal=password=ghp_xxx -n argocd
#
# HOẶC dùng declarative YAML (dưới đây):

apiVersion: v1
kind: Secret
metadata:
  name: platform-gitops
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  url: https://github.com/thanhhoanace/gitops-platform.git
  username: thanhhoan2605
  type: git
  project: platform
  password: REPLACE_ME
