apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher
  namespace: argocd
spec:
  sources:
    - repoURL: https://releases.rancher.com/server-charts/stable
      chart: rancher
      targetRevision: 2.12.3 # phiên bản Rancher
      helm:
        releaseName: rancher
        valuesObject:
          hostname: rancher.acemaster.shop
          bootstrapPassword: "REPLACE_ME"
          ingress:
            enabled: false
          replicas: 1
          noCACerts: true
    - repoURL: https://github.com/thanhhoanace/gitops-platform.git
      targetRevision: master
      path: 1-cluster-scoped/cattle-system/overlays/oracle
