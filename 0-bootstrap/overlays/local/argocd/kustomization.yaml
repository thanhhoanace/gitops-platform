apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ghi đè các giá trị của Helm chart
helmCharts:
  - name: argo-cd
    releaseName: argocd
    version: 8.5.6
    repo: https://argoproj.github.io/argo-helm
    namespace: argocd
    valuesFile: values-override.yaml

patches:   
  - target:
      kind: Application
      name: argocd
      namespace: argocd
    patch: |-
      - op: replace
        path: /spec/source/targetRevision
        value: main