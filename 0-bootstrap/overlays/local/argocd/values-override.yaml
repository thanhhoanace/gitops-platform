dex:
  enabled: false

global:
  domain: argocd.acemaster.shop

server:
  ingress:
    enabled: true
    ingressClassName: "nginx"
    hostname: argocd.acemaster.shop
    tls: true
    annotations:
      kubernetes.io/ingress.class: "nginx"
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"

configs:
  cm:
    url: https://argocd.acemaster.shop
    admin.enabled: true
    exec.enabled: true

    oidc.config: |
      name: GitLab
      issuer: https://gitlab.yourcompany.com
      clientID: YOUR_GITLAB_APPLICATION_ID
      clientSecret: $oidc.gitlab.clientSecret
      # Một số GitLab cần scope read_user để trả email/username đầy đủ
      requestedScopes:
        - openid
        - profile
        - email
        - read_user
  # Tạo secret chứa client secret của GitLab
  secrets:
    extra:
      oidc.gitlab.clientSecret: "YOUR_GITLAB_CLIENT_SECRET"

  credentialTemplates:
    gitlab-all:
      url: https://gitlab.com/
      username: gitlab+deploy-token-9283299
      password: REPLACE_ME


  # Cấu hình RBAC
  rbac:
    create: true
    # Mặc định chỉ xem (tùy bạn)
    policy.default: role:readonly
    
    # Khai báo ArgoCD kiểm tra thêm claim "email" khi enforce RBAC
    # (mặc định là ["groups"]; nếu GitLab không bơm "groups", map theo email)
    scopes: '["email"]'
    policy.csv: |
      g, your.admin.email@company.com, role:admin
      g, some.developer.email@company.com, proj:retail:readonly